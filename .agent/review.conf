# Reviewer settings for the cross-review skill's scripts/review.sh. Format: KEY=value, one per line.
# The last line for a key wins; text after " #" is a comment.
REVIEWER=claude               # Sam, 2026-10-31: Codex takes over development; Claude Fable 5.1 reviews
CODEX_MODEL=gpt-6-astra
CODEX_EFFORT=xhigh
SANDBOX=workspace-write       # Codex-only setting; Claude runs read-only in plan mode
CLAUDE_MODEL=claude-fable-5-1  # passed explicitly by the cross-review runner
CLAUDE_EFFORT=xhigh           # passed explicitly; no silent fallback
PACKET=allowed                # allowed or forbidden: self-contained packets for reviewers without file access
EXTERNAL_MANIFEST=            # repo path of a sha256 manifest binding inputs outside git, or empty
REVIEW_PYTHON=/exp/mu2e/app/users/wzhou2/projects/miniproject_1/.venv/bin/python   # GPU node, Python 3.12.16; ignored by git
REVIEW_DEPS=                  # colon-separated absolute paths the reviewer needs (ignored dirs, data), or empty
